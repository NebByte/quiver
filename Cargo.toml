[package]
name = "quiver"
version = "0.1.0"
edition = "2021"
description = "ARM-optimized memory-efficient data structure primitives — PoC"
default-run = "quiver-bench"

[lib]
name = "quiver"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "quiver-bench"
path = "src/main.rs"

[[bin]]
name = "benchmark-json"
path = "src/bin/benchmark_json.rs"

[[bin]]
name = "quiver-server"
path = "src/bin/server.rs"

[[bin]]
name = "benchmark_db"
path = "src/bin/benchmark_db.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
csv = "1.4.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "fs"] }
