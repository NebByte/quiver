[package]
name = "quiver"
version = "0.1.0"
edition = "2021"
description = "ARM-optimized memory-efficient data structure primitives — PoC"

[lib]
name = "quiver"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "quiver-bench"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dependencies]
rusqlite = { version = "0.39.0", features = ["bundled"] }
