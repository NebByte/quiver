name: ARM Benchmark → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Benchmark
        run: cargo build --release --bin benchmark-json

      - name: Run ARM Benchmark
        run: |
          echo "Running live benchmark on ARM Neoverse..."
          ./target/release/benchmark-json > docs/results.json
          cat docs/results.json

      - name: Commit Results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/results.json
          git commit -m "Update ARM benchmark results [bot]" || echo "No changes"
          git push
